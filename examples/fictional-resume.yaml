            en: "Coursework: Data Structures, Operating Systems, Computer Networks, Distributed Systems, Databases, Machine Learning."
            zh: 核心课程：数据结构、操作系统、计算机网络、分布式系统、数据库、机器学习。
          metric_refs: []
