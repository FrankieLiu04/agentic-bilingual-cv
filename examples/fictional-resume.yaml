        end: "2024"
      technologies: [Python, FastAPI, PostgreSQL, React, Docker]
      highlights:
        - id: atlasnote_retrieval
          text:
            en: Indexed 12,000 synthetic abstracts and improved top-5 retrieval hit rate from 71% to 84% with query expansion.
            zh: 索引 12,000 篇合成摘要，通过查询扩展将前五项检索命中率从 71% 提升至 84%。
          metric_refs: [indexed_abstracts, retrieval_before, retrieval_after]
