        zh: MiniKV 基于 Raft 的分布式键值存储
      date:
        start: "2023"
        end: "2023"
      technologies: [Go, gRPC, Raft]
      highlights:
        - id: minikv_consensus
          text:
            en: Implemented leader election, log replication, and snapshotting in Go with gRPC on a 5-node cluster.
            zh: 使用 Go 与 gRPC 在 5 节点集群上实现选举、日志复制与快照。
          metric_refs: []
          verification: *fictional_verification
        - id: minikv_performance
          text:
            en: Sustained 18k ops/s with 3-second leader failover under simulated partitions.
            zh: 在模拟网络分区下维持 1.8 万次操作/秒，主节点 3 秒内完成切换。
          metric_refs: [kv_qps, kv_failover]
          verification: *fictional_verification
      verification: *fictional_verification

    - id: project_meshroute
      name:
        en: MeshRoute Network Lab
        zh: MeshRoute 网络实验台
      date:
        start: "2023"
        end: "2023"
      technologies: [Python, NetworkX]
      highlights:
        - id: meshroute_simulation
          text:
            en: Visualized shortest paths and failure recovery across 50-node topologies, verified with 120 generated scenarios.
            zh: 可视化 50 节点拓扑的最短路径与故障恢复，并通过 120 个生成场景验证。
          metric_refs: [topology_nodes, generated_scenarios]
