          text:
            en: Delivered a React operations dashboard for an 8-person team, cutting weekly report preparation from 4 hours to 45 minutes.
            zh: 为 8 人运营团队交付 React 仪表板，将每周报告准备时间从 4 小时缩短至 45 分钟。
          metric_refs: [operations_team_size, report_time_before, report_time_after]
          verification: *fictional_verification
        - id: cobalt_accessibility
          text:
            en: Reworked keyboard navigation and status labels to satisfy the team's internal accessibility checklist.
            zh: 重构键盘导航与状态标签，满足团队内部无障碍检查清单要求。
          metric_refs: []
          verification: *fictional_verification
      verification: *fictional_verification

  projects:
    - id: project_atlasnote
