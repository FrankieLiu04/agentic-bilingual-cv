  experience:
    - id: experience_nebula_cloud
      organization:
        en: Nebula Cloud
        zh: 星云科技
      role:
        en: Backend Engineer Intern
        zh: 后端开发实习生
      date:
        start: "2024-05"
        end: "2024-08"
      location:
        en: Port Aurora
        zh: 曙港
      highlights:
        - id: nebula_cache
          text:
            en: Designed a Redis cache layer for the order-query service, cutting p99 latency from 120 ms to 45 ms at 120k QPS.
            zh: 为订单查询服务设计 Redis 缓存层，在 12 万 QPS 下将 p99 延迟从 120 ms 降至 45 ms。
          metric_refs: [cache_latency_before, cache_latency_after, peak_qps]
          verification: *fictional_verification
        - id: nebula_kafka
          text:
            en: Built a Kafka event pipeline processing 20k events/s and added 40 integration tests for the delivery-notification flow.
            zh: 搭建 Kafka 事件管道，每秒处理 2 万条事件，并为发货通知链路补充 40 项集成测试。
          metric_refs: [kafka_throughput, integration_tests]
          verification: *fictional_verification
      verification: *fictional_verification

    - id: experience_cobalt_kite
      organization:
        en: Cobalt Kite Studio
        zh: 苍鸢工作室
      role:
        en: Product Engineering Intern
        zh: 产品工程实习生
      date:
        start: "2023-07"
        end: "2023-08"
      location:
        en: Port Aurora
        zh: 曙港
      highlights:
