name: Build and validate

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false

      - name: Install XeLaTeX, CJK fonts, and Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fonts-noto-cjk \
            poppler-utils \
            texlive-fonts-recommended \
            texlive-latex-recommended \
            texlive-xetex

      - name: Run tests and build both languages
        run: make check

      - name: Upload fictional PDFs
        uses: actions/upload-artifact@v7
        with:
          name: fictional-bilingual-resume
          path: |
            build/examples/resume-en.pdf
            build/examples/resume-zh.pdf
            build/examples/validation-report.txt
